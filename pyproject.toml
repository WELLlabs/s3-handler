[project]
name = "s3-handler"
version = "0.1.0"
description = "FastAPI application for S3 file operations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=15.4.0",
    "fastapi>=0.120.0",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "pytest>=8.4.2",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
]
